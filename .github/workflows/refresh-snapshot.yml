name: Refresh snapshot

# 22:30 UTC on weekdays: 6:30pm ET in summer, 5:30pm ET in winter. Both sit
# comfortably after the 4pm close and after FMP has settled its end-of-day bars.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      top_n:
        description: "Universe size"
        required: false
        default: "100"

# Never let two refreshes race for the same commit.
concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The script validates before it writes, so a failure here leaves the
      # committed snapshot.json exactly as it was and the job stops short of
      # the commit step below.
      - name: Build and validate snapshot
        env:
          # The secret may be stored under either name; the script prefers
          # FMP_API_KEY and falls back to API_KEY, so passing both means the
          # run does not hinge on which one was typed into Settings.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          TOP_N: ${{ github.event.inputs.top_n || '100' }}
        run: python scripts/build_snapshot.py

      - name: Commit refreshed snapshot
        run: |
          set -euo pipefail
          if git diff --quiet -- data/snapshot.json; then
            echo "Snapshot unchanged; nothing to commit."
            exit 0
          fi

          DATA_DATE=$(python -c "import json;print(json.load(open('data/snapshot.json'))['dataDate'])")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "Refresh snapshot for ${DATA_DATE}"

          # Another run may have landed first; rebase and retry rather than fail.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          echo "Could not push refreshed snapshot." >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f data/snapshot.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("data/snapshot.json"))
          print(f"### Snapshot\n")
          print(f"- Data date: `{s['dataDate']}`")
          print(f"- Generated: `{s['generatedAt']}`")
          print(f"- Tickers: **{s['universeSize']}** over {s['sessions']} sessions")
          print(f"\nTop 5: " + ", ".join(t["symbol"] for t in s["tickers"][:5]))
          PY
          else
            echo "No snapshot present." >> "$GITHUB_STEP_SUMMARY"
          fi
