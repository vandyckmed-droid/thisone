<title>Top 300</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* The app's own system: dark, minimal, industrial. One acid accent doing all
     the signalling work; everything else graphite. Deliberately single-theme —
     this page is the phone app on a bigger screen, not a document. */
  :root {
    --bg: #0A0B0C;
    --surface: #141518;
    --surface-hi: #1C1E22;
    --line: #2A2D32;
    --line-soft: #1F2226;
    --text: #F0F1F2;
    --dim: #B6BCC4;
    --faint: #8A9098;
    --acid: #C8FF00;
    --acid-glow: rgba(200,255,0,0.10);
    --down: #FF6B4F;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    --gutter: 16px;
  }
  * { box-sizing: border-box; }
  /* Some hidden things also carry display:flex, which would beat the UA's
     [hidden] rule and leave an empty filter bar on an unfiltered list. */
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button {
    appearance: none; background: none; border: none; padding: 0; margin: 0;
    color: inherit; font: inherit; cursor: pointer; text-align: inherit;
  }
  button:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--acid); outline-offset: 2px; border-radius: 3px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .shell {
    max-width: 640px; margin: 0 auto; height: 100dvh;
    display: flex; flex-direction: column; position: relative;
    border-left: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft);
    overflow: hidden;
  }
  .pane { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .pane.active { display: flex; }

  /* ------------------------------------------------------------- header */
  .header { padding: 14px var(--gutter) 12px; }
  .header-btn { display: block; width: 100%; }
  .header-btn:active { opacity: 0.6; }
  .title-row { display: flex; align-items: baseline; gap: 8px; }
  .title {
    font-family: var(--mono); font-size: 20px; letter-spacing: 3px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .caret { color: var(--acid); font-family: var(--mono); font-size: 13px; }
  .subtitle {
    color: var(--faint); font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.6px; margin-top: 6px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-side { display: flex; justify-content: space-between; align-items: flex-start; }
  .avg { text-align: right; }
  .avg-label { color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 0.6px; }
  .avg-value { font-family: var(--mono); font-size: 15px; margin-top: 4px; }

  /* -------------------------------------------------------- filter row */
  .filter-row { display: flex; gap: 8px; margin: 0 var(--gutter) 10px; }
  .search-wrap { flex: 1; position: relative; display: flex; }
  .search {
    flex: 1; padding: 11px 34px 11px 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); font-family: var(--mono); font-size: 12px;
    text-transform: uppercase; min-width: 0;
  }
  .search::placeholder { color: var(--faint); text-transform: none; }
  .clear {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; color: var(--dim); font-size: 19px; text-align: center;
    display: none;
  }
  .clear.show { display: block; }
  .select-btn {
    padding: 11px 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; color: var(--dim); font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.6px; white-space: nowrap; max-width: 40%;
    overflow: hidden; text-overflow: ellipsis;
  }
  .select-btn.active { color: var(--acid); border-color: var(--acid); background: var(--acid-glow); }

  /* -------------------------------------------------------------- chips */
  .chip-row {
    display: flex; gap: 7px; overflow-x: auto; padding: 2px var(--gutter) 10px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--dim);
    font-family: var(--mono); font-size: 11px; letter-spacing: 1px; white-space: nowrap;
    flex-shrink: 0;
  }
  .chip.active { color: var(--acid); border-color: var(--acid); background: var(--acid-glow); }

  /* ------------------------------------------------------------ columns */
  .columns {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px var(--gutter) 8px; border-bottom: 1px solid var(--line);
  }
  .columns span { color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 0.8px; }
  .col-metric { color: var(--text); }
  .col-dir { color: var(--acid); }

  .summary {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px var(--gutter); background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .summary-text { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .summary-clear { color: var(--acid); font-family: var(--mono); font-size: 11px; letter-spacing: 1px; padding-left: 12px; }

  /* --------------------------------------------------------------- list */
  .list { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .row {
    display: flex; align-items: center; width: 100%;
    padding: 13px calc(var(--gutter) - 2px);
    border-bottom: 1px solid var(--line-soft);
    border-left: 2px solid transparent;
  }
  .row:active { background: var(--surface); }
  .row.starred { border-left-color: var(--acid); background: rgba(200,255,0,0.05); }
  .pos { width: 30px; color: var(--faint); font-family: var(--mono); font-size: 11px; flex-shrink: 0; }
  .tile {
    width: 30px; height: 30px; border-radius: 7px; background: var(--surface-hi);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-family: var(--mono); font-size: 12px; margin-right: 11px; flex-shrink: 0;
    overflow: hidden;
  }
  .tile img { width: 22px; height: 22px; object-fit: contain; }
  /* Art with its own background fills the tile; the radius does the clipping. */
  .tile.full { background: none; border-color: transparent; }
  .tile.full img { width: 100%; height: 100%; object-fit: cover; }
  .identity { flex: 1; min-width: 0; padding-right: 8px; text-align: left; }
  .sym { display: block; color: var(--text); font-family: var(--mono); font-size: 13px; letter-spacing: 0.5px; }
  .nm { display: block; color: var(--faint); font-size: 11px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spark { width: 54px; height: 22px; margin-right: 10px; flex-shrink: 0; }
  /* One number to the row now that price has gone, so it carries the weight
     price used to. */
  .nums { min-width: 66px; text-align: right; flex-shrink: 0; }
  .metric { display: block; color: var(--text); font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
  /* A watchlist row carries a second line, so it stacks rather than sitting
     on one baseline. */
  .row-tall { flex-direction: column; align-items: stretch; }
  .row-main { display: flex; align-items: center; }
  .range { display: flex; align-items: center; gap: 9px; margin: 10px 0 1px 30px; }
  .range-cap { color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 1px; }
  .range-end { color: var(--faint); font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
  .range-track { position: relative; flex: 1; height: 3px; min-width: 40px; background: var(--line); border-radius: 2px; }
  /* End caps, so the track reads as a scale between two prices rather than a
     progress bar that happens to have stopped. */
  .range-track::before, .range-track::after {
    content: ''; position: absolute; top: -3px; width: 1px; height: 9px; background: var(--line);
  }
  .range-track::before { left: 0; }
  .range-track::after { right: 0; }
  .range-dot {
    position: absolute; top: 50%; width: 7px; height: 7px; border-radius: 50%;
    background: var(--acid); transform: translate(-50%, -50%);
  }
  .range-off {
    color: var(--dim); font-family: var(--mono); font-size: 11px;
    min-width: 54px; text-align: right; font-variant-numeric: tabular-nums;
  }

  .star { padding: 8px 2px 8px 12px; color: var(--faint); font-size: 19px; line-height: 23px; flex-shrink: 0; }
  .star.on { color: var(--acid); }
  .up { color: var(--acid); } .dn { color: var(--down); } .flat { color: var(--faint); }

  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 34px; text-align: center; }
  .empty-title { color: var(--text); font-family: var(--mono); font-size: 15px; letter-spacing: 2px; }
  .empty-hint { color: var(--faint); font-size: 12px; line-height: 19px; margin-top: 12px; max-width: 300px; }

  .list-foot { padding: 18px var(--gutter) 26px; color: var(--faint); font-size: 11px; line-height: 17px; border-top: 1px solid var(--line-soft); }
  .list-foot .k { font-family: var(--mono); color: var(--dim); }

  /* ------------------------------------------------------------ tab bar */
  .tab-bar {
    display: flex; border-top: 1px solid var(--line); background: var(--surface);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab { flex: 1; min-height: 44px; padding: 8px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .tab-mark { width: 18px; height: 2px; background: transparent; margin-bottom: 7px; }
  .tab.active .tab-mark { background: var(--acid); }
  .tab-label { color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 1.4px; }
  .tab.active .tab-label { color: var(--acid); }

  /* -------------------------------------------------------------- sheet */
  .sheet-back {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40;
    display: none; align-items: flex-end; justify-content: center;
  }
  .sheet-back.open { display: flex; }
  .sheet {
    width: 100%; max-width: 640px; max-height: 72dvh; display: flex; flex-direction: column;
    background: var(--surface); border-radius: 14px 14px 0 0;
    border: 1px solid var(--line); border-bottom: none;
  }
  .sheet-title { padding: 16px var(--gutter) 4px; color: var(--text); font-family: var(--mono); font-size: 12px; letter-spacing: 2px; }
  .sheet-hint { padding: 4px var(--gutter) 10px; color: var(--faint); font-size: 11px; line-height: 17px; }
  .sheet-list { overflow-y: auto; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  .sheet-opt {
    display: flex; align-items: center; width: 100%; min-height: 44px;
    padding: 11px var(--gutter); border-top: 1px solid var(--line-soft);
  }
  .sheet-opt:active { background: var(--surface-hi); }
  .opt-label { flex: 1; color: var(--dim); font-family: var(--mono); font-size: 12px; letter-spacing: 0.8px; text-align: left; }
  .sheet-opt.active .opt-label { color: var(--acid); }
  .opt-count { color: var(--faint); font-family: var(--mono); font-size: 11px; margin-left: 12px; }
  .opt-check { width: 22px; text-align: right; color: var(--acid); font-family: var(--mono); font-size: 12px; visibility: hidden; }
  .sheet-opt.active .opt-check { visibility: visible; }

  /* ------------------------------------------------------------- ticker */
  .overlay {
    position: absolute; inset: 0; background: var(--bg); z-index: 20;
    display: none; flex-direction: column;
  }
  .overlay.open { display: flex; }
  .overlay-scroll { flex: 1; overflow-y: auto; padding: 0 var(--gutter) 44px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 16px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  .back-btn, .watch-btn { color: var(--dim); font-family: var(--mono); font-size: 12px; letter-spacing: 1px; padding: 6px 0; }
  .watch-btn.on { color: var(--acid); }

  .t-identity { display: flex; align-items: center; }
  .t-tile {
    width: 46px; height: 46px; border-radius: 9px; background: var(--surface-hi);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-family: var(--mono); font-size: 18px; margin-right: 13px; flex-shrink: 0;
    overflow: hidden;
  }
  .t-tile img { width: 34px; height: 34px; object-fit: contain; }
  .t-tile.full { background: none; border-color: transparent; }
  .t-tile.full img { width: 100%; height: 100%; object-fit: cover; }
  .t-symbol { color: var(--text); font-family: var(--mono); font-size: 26px; letter-spacing: 2px; }
  .t-name { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .t-meta { color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 0.6px; margin-top: 11px; text-transform: uppercase; }

  .price-block { display: flex; align-items: flex-end; justify-content: space-between; margin: 18px 0 16px; }
  .t-price { color: var(--text); font-family: var(--mono); font-size: 34px; font-variant-numeric: tabular-nums; }
  .t-change { font-family: var(--mono); font-size: 13px; margin-top: 5px; }
  .cap-block { text-align: right; padding-bottom: 4px; }
  .cap-label { color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 0.6px; }
  .cap-value { color: var(--text); font-family: var(--mono); font-size: 15px; margin-top: 4px; }

  .overlay .chip-row { padding-left: 0; padding-right: 0; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; }
  .chart-label { color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 1.2px; }
  .chart-change { font-family: var(--mono); font-size: 13px; }

  .readout { display: flex; align-items: baseline; justify-content: space-between; margin: 10px 0 6px; min-height: 20px; }
  .readout-main { color: var(--text); font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
  .readout-main .k { color: var(--faint); font-size: 11px; }
  .readout-date { color: var(--faint); font-family: var(--mono); font-size: 11px; }
  .chart-box { position: relative; height: 200px; touch-action: pan-y; cursor: crosshair; }
  .chart-box svg { display: block; width: 100%; height: 100%; }
  .chart-hint {
    position: absolute; top: 8px; left: 0; right: 0; text-align: center; pointer-events: none;
  }
  .chart-hint span {
    color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: 1.6px;
    background: rgba(20,21,24,0.85); padding: 5px 10px; border-radius: 5px;
  }
  .axis { display: flex; justify-content: space-between; margin-top: 6px; }
  .axis span { color: var(--faint); font-family: var(--mono); font-size: 11px; }
  .chart-note { color: var(--faint); font-size: 11px; line-height: 16px; margin-top: 8px; }

  .range-big { margin-top: 14px; }
  .range-heads { display: flex; justify-content: space-between; align-items: baseline; }
  .range-price { color: var(--text); font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
  .range-when { color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 0.6px; }
  .range-track.big { height: 4px; margin: 12px 0 9px; }
  .range-track.big::before, .range-track.big::after { top: -4px; height: 12px; }
  .range-track.big .range-dot { width: 10px; height: 10px; }

  .section-title { color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 2px; margin: 26px 0 0; }
  .grid { display: flex; flex-wrap: wrap; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 4px; }
  .stat { width: 33.33%; padding: 10px 8px 10px 0; }
  .stat.half { width: 50%; }
  .stat-label { color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 0.6px; }
  .stat-value { color: var(--text); font-family: var(--mono); font-size: 15px; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .note { color: var(--faint); font-size: 11px; line-height: 17px; margin-top: 10px; }
  details { margin-top: 12px; }
  summary {
    color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
    cursor: pointer; list-style: none; padding: 6px 0;
  }
  summary::-webkit-details-marker { display: none; }
  .prose { color: var(--dim); font-size: 12px; line-height: 19px; margin: 11px 0 0; }

  .footnote { color: var(--faint); font-size: 11px; line-height: 16px; margin-top: 26px; border-top: 1px solid var(--line-soft); padding-top: 12px; }

  /* ---------------------------------------------------- formula controls */
  /* The score is built from parts the reader can switch, so the sheet that
     edits it is toggle rows and window chips rather than a pick-one list. */
  .f-section { padding: 10px var(--gutter) 2px; color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 1.6px; }
  .f-chiprow { display: flex; gap: 7px; padding: 8px var(--gutter) 6px; flex-wrap: wrap; }
  .f-toggle {
    display: flex; align-items: center; width: 100%; min-height: 44px;
    padding: 10px var(--gutter); border-top: 1px solid var(--line-soft); gap: 12px;
  }
  .f-toggle:active { background: var(--surface-hi); }
  .f-toggle[disabled] { opacity: 0.45; }
  .f-text { flex: 1; text-align: left; }
  .f-label { display: block; color: var(--dim); font-family: var(--mono); font-size: 12px; letter-spacing: 0.8px; }
  .f-toggle.on .f-label { color: var(--text); }
  .f-sub { display: block; color: var(--faint); font-size: 11px; line-height: 15px; margin-top: 3px; }
  .f-pill {
    flex-shrink: 0; min-width: 44px; text-align: center;
    padding: 5px 9px; border-radius: 7px; border: 1px solid var(--line);
    color: var(--faint); font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
  }
  .f-toggle.on .f-pill { color: var(--acid); border-color: var(--acid); background: var(--acid-glow); }
  .f-reset { display: block; width: 100%; min-height: 44px; padding: 12px var(--gutter); border-top: 1px solid var(--line); color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-align: center; }
  .f-formula {
    margin: 6px var(--gutter) 2px; padding: 10px 12px; border: 1px solid var(--line-soft);
    border-radius: 8px; background: var(--bg);
    color: var(--dim); font-family: var(--mono); font-size: 11px; line-height: 17px;
  }
  .f-formula .k { color: var(--acid); }
</style>

<div class="shell" id="shell">
  <!-- ============================================================ RANKS -->
  <div class="pane active" id="pane-ranks">
    <div class="header">
      <button class="header-btn" id="universe-btn" aria-label="Change universe">
        <div class="title-row">
          <span class="title" id="ranks-title"></span><span class="caret">▾</span>
        </div>
        <div class="subtitle" id="ranks-subtitle"></div>
      </button>
    </div>
    <div class="filter-row">
      <div class="search-wrap">
        <input class="search" id="search" placeholder="Search symbol or name"
               autocapitalize="characters" autocomplete="off" spellcheck="false"
               aria-label="Search by symbol or company name">
        <button class="clear" id="search-clear" aria-label="Clear search">×</button>
      </div>
      <button class="select-btn" id="cut-btn" aria-label="Sector filter"></button>
    </div>
    <div class="chip-row" id="sort-chips" role="tablist" aria-label="Sort by metric"></div>
    <button class="columns" id="dir-btn" aria-label="Reverse sort direction">
      <span>#&nbsp;&nbsp;TICKER</span>
      <span><span class="col-metric" id="col-metric"></span><span class="col-dir" id="col-dir"></span></span>
    </button>
    <div class="summary" id="summary" hidden>
      <span class="summary-text" id="summary-text"></span>
      <button class="summary-clear" id="summary-clear">CLEAR</button>
    </div>
    <div class="list" id="ranks-list"></div>
  </div>

  <!-- ============================================================ WATCH -->
  <div class="pane" id="pane-watchlist">
    <div class="header header-side">
      <div>
        <div class="title">WATCHLIST</div>
        <div class="subtitle" id="watch-subtitle"></div>
      </div>
      <div class="avg" id="watch-avg" hidden>
        <div class="avg-label">EQUAL-WEIGHT AVG 1D</div>
        <div class="avg-value" id="watch-avg-value"></div>
      </div>
    </div>
    <div class="chip-row" id="watch-chips" aria-label="Sort watchlist by metric"></div>
    <div class="columns" id="watch-columns" hidden>
      <span>#&nbsp;&nbsp;IN THIS LIST</span>
      <span><span class="col-metric" id="watch-col-metric"></span></span>
    </div>
    <div class="list" id="watch-list"></div>
  </div>

  <!-- =========================================================== TICKER -->
  <div class="overlay" id="ticker-overlay" role="dialog" aria-modal="true">
    <div class="overlay-scroll" id="ticker-scroll"></div>
  </div>

  <!-- ============================================================= TABS -->
  <div class="tab-bar" role="tablist">
    <button class="tab active" data-tab="ranks" role="tab" aria-selected="true">
      <span class="tab-mark"></span><span class="tab-label">RANKS</span>
    </button>
    <button class="tab" data-tab="watchlist" role="tab" aria-selected="false">
      <span class="tab-mark"></span><span class="tab-label" id="watch-tab-label">WATCH</span>
    </button>
  </div>

  <!-- ============================================================ SHEET -->
  <div class="sheet-back" id="sheet-back">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-hint" id="sheet-hint" hidden></div>
      <div class="sheet-list" id="sheet-list"></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* Data is baked in at build time by scripts/build_web.py — an artifact page
   cannot fetch, so this file IS the snapshot. Regenerate + republish to
   refresh it. */
const DATA = /*__DATA__*/;
/* Base64 WebP by symbol, baked in by scripts/fetch_logos.py. The artifact CSP
   blocks the logo CDN, so a logo either lives in this file or is a letter. */
const LOGOS = /*__LOGOS__*/;
/* Symbols whose art carries its own opaque background — see fetch_logos.py. */
const OPAQUE = new Set(/*__OPAQUE__*/);
const BUILT = /*__BUILT__*/;

/* Issuers supply two incompatible kinds of art, so the tile has two modes: a
   transparent mark sits inset on the dark surface, while one baked onto its
   own background fills the tile edge to edge and is clipped by its radius —
   an app icon rather than a bright hole punched through the list. A symbol
   with no logo at all keeps its letter. */
function logoHtml(symbol, cls) {
  const b64 = LOGOS[symbol];
  if (!b64) return `<span class="${cls}" aria-hidden="true">${esc(symbol.slice(0, 1))}</span>`;
  const full = OPAQUE.has(symbol) ? ' full' : '';
  return `<span class="${cls}${full}" aria-hidden="true">` +
    `<img src="data:image/webp;base64,${b64}" alt="" loading="lazy" decoding="async"></span>`;
}

/* ========================================================== score formula
   The score is not published in the data — it is built here, at view time,
   from raw closes and the tables' benchmark series, because every part of the
   formula is a setting the reader can change. One engine, no alternates. */
const LOOKBACKS = [63, 126, 189, 252];
const LOOKBACK_LABEL = { 63: '3M', 126: '6M', 189: '9M', 252: '12M' };
/* round(lookback / 12) sessions excluded when SKIP is on. Written out rather
   than computed: Math.round(10.5) is 11, and 126's skip is defined as 10. */
const SKIP = { 63: 5, 126: 10, 189: 16, 252: 21 };
/* Betas are estimated over this many return observations ending at the
   scoring window's cutoff — the estimation stretch contains the window. */
const EST_SESSIONS = 504;
/* A beta from a few dozen observations is noise in every residual; a name
   without at least a year of paired returns scores nothing instead. */
const MIN_EST_RETURNS = 252;

const DEFAULT_FORMULA = {
  blend: true,          // average two windows 50/50
  windows: [252, 126],  // [0] always scored; [1] joins when blend is on
  skip: true,           // exclude the most recent SKIP[w] sessions
  vol: true,            // divide mean return by same-window volatility
  market: true,         // score residuals over a VTI beta
  sector: false,        // score residuals over VTI + sector-factor betas
};

function normalizeFormula(raw) {
  const f = { ...DEFAULT_FORMULA, ...(raw || {}) };
  const w = Array.isArray(f.windows) ? f.windows : [];
  f.windows = [
    LOOKBACKS.includes(w[0]) ? w[0] : DEFAULT_FORMULA.windows[0],
    LOOKBACKS.includes(w[1]) ? w[1] : DEFAULT_FORMULA.windows[1],
  ];
  if (f.windows[1] === f.windows[0]) {
    f.windows[1] = f.windows[0] === DEFAULT_FORMULA.windows[1]
      ? DEFAULT_FORMULA.windows[0] : DEFAULT_FORMULA.windows[1];
  }
  for (const k of ['blend', 'skip', 'vol', 'market', 'sector']) f[k] = !!f[k];
  // The sector model is VTI *plus* the sector factor by definition, so sector
  // residuals imply the market leg.
  if (f.sector) f.market = true;
  return f;
}

const activeWindows = (f) => (f.blend ? f.windows : [f.windows[0]]);
const maxSkipOf = (f) => (f.skip ? Math.max(...activeWindows(f).map((w) => SKIP[w])) : 0);
const formulaName = (f) => activeWindows(f).map((w) => LOOKBACK_LABEL[w]).join('+');
function formulaTags(f) {
  const tags = [];
  if (f.skip) tags.push('SKIP');
  if (f.vol) tags.push('VOL-ADJ');
  if (f.sector) tags.push('MKT+SECT RESID');
  else if (f.market) tags.push('MKT RESID');
  return tags;
}
const describeFormula = (f) =>
  [formulaName(f), ...formulaTags(f)].join(' · ') || 'RAW RETURN';

/* Daily log returns aligned to the shared calendar; NaN where either close is
   missing, index 0 always NaN. One pass per series, cached per table. */
function logReturns(history) {
  const out = new Array(history ? history.length : 0).fill(NaN);
  for (let i = 1; i < out.length; i += 1) {
    const a = history[i - 1]; const b = history[i];
    if (a > 0 && b > 0) out[i] = Math.log(b / a);
  }
  return out;
}

const returnsCache = {};
function tableReturns(key) {
  if (!returnsCache[key]) {
    const table = DATA.tables[key];
    const marks = table.benchmarks || {};
    const sectors = {};
    for (const [name, s] of Object.entries(marks.sectors || {})) {
      sectors[name] = logReturns(s.history);
    }
    returnsCache[key] = {
      market: logReturns((marks.market || {}).history),
      sectors,
      bySymbol: new Map(table.tickers.map((t) => [t.symbol, logReturns(t.history)])),
    };
  }
  return returnsCache[key];
}

/**
 * One window of the score, per the current formula.
 *
 * The scoring window is the `w` daily log returns ending `skip` sessions
 * back (0 when SKIP is off), and it is all-or-nothing: a partial window
 * would hand a younger company a different question, not a worse answer.
 *
 * Residual modes regress the stock on VTI (and its sector factor) over the
 * EST_SESSIONS returns ending at the same cutoff — plain OLS with an
 * intercept, so betas come from centered sums — then score
 * r − β·m (− β₂·s) inside the window. The base score is the mean of those
 * daily returns; the VOL toggle divides it by their own standard deviation
 * over the same window.
 */
function windowScore(rets, market, sectorArr, n, w, f) {
  const skip = f.skip ? SKIP[w] : 0;
  const cut = n - 1 - skip;   // index of the window's last return
  const start = cut - w + 1;  // and its first; index 0 has no return
  if (start < 1) return null;

  const useMarket = f.market || f.sector;
  const useSector = f.sector;
  if (useSector && !sectorArr) return null; // no factor series for this sector

  let b1 = 0; let b2 = 0;
  if (useMarket) {
    const estStart = Math.max(1, cut - EST_SESSIONS + 1);
    let k = 0; let sy = 0; let sm = 0; let sz = 0;
    const ys = []; const ms = []; const zs = [];
    for (let i = estStart; i <= cut; i += 1) {
      const y = rets[i]; const m = market[i];
      const z = useSector ? sectorArr[i] : 0;
      if (!isFinite(y) || !isFinite(m) || !isFinite(z)) continue;
      ys.push(y); ms.push(m); zs.push(z);
      sy += y; sm += m; sz += z; k += 1;
    }
    if (k < MIN_EST_RETURNS) return null;
    const my = sy / k; const mm = sm / k; const mz = sz / k;
    let smm = 0; let smy = 0; let szz = 0; let szy = 0; let smz = 0;
    for (let i = 0; i < k; i += 1) {
      const dm = ms[i] - mm; const dy = ys[i] - my; const dz = zs[i] - mz;
      smm += dm * dm; smy += dm * dy;
      if (useSector) { szz += dz * dz; szy += dz * dy; smz += dm * dz; }
    }
    if (useSector) {
      const det = smm * szz - smz * smz;
      if (!(Math.abs(det) > 1e-12)) return null;
      b1 = (szz * smy - smz * szy) / det;
      b2 = (smm * szy - smz * smy) / det;
    } else {
      if (!(smm > 0)) return null;
      b1 = smy / smm;
    }
  }

  const vals = [];
  let sum = 0;
  for (let i = start; i <= cut; i += 1) {
    let r = rets[i];
    if (!isFinite(r)) return null;
    if (useMarket) {
      const m = market[i];
      if (!isFinite(m)) return null;
      r -= b1 * m;
      if (useSector) {
        const z = sectorArr[i];
        if (!isFinite(z)) return null;
        r -= b2 * z;
      }
    }
    vals.push(r); sum += r;
  }
  const mean = sum / vals.length;
  if (!f.vol) return mean;
  let vv = 0;
  for (const v of vals) vv += (v - mean) * (v - mean);
  const sd = Math.sqrt(vv / vals.length);
  if (!(sd > 0)) return null;
  return mean / sd;
}

/** The full score for one ticker: each active window, blended 50/50. */
function scoreTicker(rets, R, sector, n, f) {
  const sectorArr = R.sectors[sector] || null;
  const parts = activeWindows(f).map((w) => windowScore(rets, R.market, sectorArr, n, w, f));
  if (parts.some((p) => p === null)) return { score: null, parts };
  return { score: parts.reduce((a, b) => a + b, 0) / parts.length, parts };
}

/* ============================================================ ported model
   The screens below began as direct ports of app/src/data.js and theme.js;
   the scoring above has since replaced that model's precomputed MOM/BLEND. */
/* Three ways to order the table, and only three. Every other measure a company
   carries lives on its own screen, where there is room to say what it means.
   SCORE shows the score itself rather than a standing; where a row places is
   still there, as the row number down the left and as STANDING on the ticker
   screen. */
const SORTS = [
  { key: 'score', label: 'SCORE', short: 'SCORE', better: 'high', value: (t) => t.score, format: 'score', tone: true },
  { key: 'marketCap', label: 'MKT CAP', short: 'CAP', better: 'high', value: (t) => t.marketCap, format: 'cap', tone: true },
  { key: 'vol', label: 'VOLATILITY', short: 'VOL', better: 'low', value: (t) => t.volatility['1y'], format: 'pct0' },
];
const sortByKey = (key) => SORTS.find((s) => s.key === key) || SORTS[0];

/**
 * The score as a 0–100 standing within exactly the rows handed in.
 *
 * The raw score is an absolute quantity, which is the right thing to compute
 * and the wrong thing to read: 0.04 says nothing until you know what the field
 * looks like. So the number beside a row is its percentile among the rows on
 * screen — filter to healthcare and every standing is recomputed against those
 * hundred, because that is now the field. It also disarms the outliers: one
 * 30-bagger far clear of the pack would flatten a linear scale, but as a
 * percentile it simply takes the top slot and leaves the rest spread out.
 */
function standings(rows) {
  const scored = rows
    .filter((t) => t.score !== null && t.score !== undefined)
    .sort((a, b) => b.score - a.score);
  const out = new Map();
  const last = scored.length - 1;
  // Floored rather than rounded, so 100 belongs to the leader alone. Rounding
  // hands it to anything within half a place, and a table with two number ones
  // reads as a bug.
  scored.forEach((t, i) => out.set(t.symbol, last > 0 ? Math.floor(100 * (1 - i / last)) : 100));
  return out;
}

/** Every placing for one symbol, measured against the rows on screen. */
function ranksIn(rows, symbol) {
  const place = (extract, descending) => {
    const scored = rows.filter((t) => {
      const v = extract(t);
      return v !== null && v !== undefined;
    });
    scored.sort((a, b) => (descending ? extract(b) - extract(a) : extract(a) - extract(b)));
    const i = scored.findIndex((t) => t.symbol === symbol);
    return i < 0 ? null : i + 1;
  };
  const byReturn = (key) => place((t) => t.returns[key], true);
  return {
    count: rows.length,
    marketCap: place((t) => t.marketCap, true),
    score: place((t) => t.score, true),
    volatility: place((t) => t.volatility['1y'], false),
    '1m': byReturn('1m'), '3m': byReturn('3m'), '6m': byReturn('6m'),
    ytd: byReturn('ytd'), '1y': byReturn('1y'),
  };
}

const RANGES = [
  { key: '1M', sessions: 21 }, { key: '3M', sessions: 63 }, { key: '6M', sessions: 126 },
  { key: '9M', sessions: 189 }, { key: '1Y', sessions: 252 }, { key: '2Y', sessions: 504 },
  { key: 'MAX', sessions: Infinity },
];

function arrange(tickers, { sortKey, query, sector, industry, direction = 'desc' }) {
  const sort = sortByKey(sortKey);
  const needle = (query || '').trim().toLowerCase();
  let rows = tickers;
  if (needle) {
    rows = rows.filter((t) =>
      t.symbol.toLowerCase().includes(needle) || t.name.toLowerCase().includes(needle));
  }
  if (sector && sector !== 'All') rows = rows.filter((t) => t.sector === sector);
  if (industry && industry !== 'All') rows = rows.filter((t) => t.industry === industry);
  const bestIsHigh = sort.better === 'high';
  const descending = direction === 'desc' ? bestIsHigh : !bestIsHigh;
  return [...rows].sort((a, b) => {
    const av = sort.value(a); const bv = sort.value(b);
    const aM = av === null || av === undefined; const bM = bv === null || bv === undefined;
    if (aM && bM) return a.marketCap > b.marketCap ? -1 : 1;
    if (aM) return 1;
    if (bM) return -1;
    return descending ? bv - av : av - bv;
  });
}

function groupOptions(tickers, field, allLabel) {
  const counts = new Map();
  for (const t of tickers) {
    const v = t[field];
    if (!v) continue;
    counts.set(v, (counts.get(v) || 0) + 1);
  }
  return [
    { value: 'All', label: allLabel, count: tickers.length },
    ...Array.from(counts.entries())
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
      .map(([name, count]) => ({ value: name, label: name.toUpperCase(), count })),
  ];
}

function seriesFor(ticker, dates, sessions) {
  const points = [];
  for (let i = 0; i < ticker.history.length; i += 1) {
    const close = ticker.history[i];
    if (close !== null && close !== undefined) points.push({ date: dates[i], close });
  }
  if (!Number.isFinite(sessions) || points.length <= sessions) return points;
  return points.slice(points.length - sessions);
}

function downsample(points, count) {
  if (points.length <= count) return points;
  const step = (points.length - 1) / (count - 1);
  const out = [];
  for (let i = 0; i < count; i += 1) out.push(points[Math.round(i * step)]);
  return out;
}

function changeOver(points) {
  if (points.length < 2) return null;
  const first = points[0].close;
  const last = points[points.length - 1].close;
  if (!first) return null;
  return (last / first - 1) * 100;
}

/* A whole-market table already carries its size in its title — "Top 300",
   "Next 300" — so naming it is enough. Saying "TOP 300" for every such table
   would call the second band a top, which it is the opposite of. */
const universeLabel = (t) => (t.scope === 'sector'
  ? `${t.title.toUpperCase()} ${t.universeSize}` : t.title.toUpperCase());
/* The pipeline writes the one-line description, because only it knows whether
   a table is a plain "largest N" or a rank band. */
const describeUniverse = (t) => (t.blurb ? t.blurb.toUpperCase()
  : t.scope === 'sector'
    ? `${t.universeSize} LARGEST ${t.title.toUpperCase()} COMPANIES`
    : `${t.universeSize} LARGEST US COMPANIES`);

const fmtCap = (n) => {
  if (!n && n !== 0) return '—';
  if (n >= 1e12) return `${(n / 1e12).toFixed(2)}T`;
  if (n >= 1e9) return `${(n / 1e9).toFixed(1)}B`;
  if (n >= 1e6) return `${(n / 1e6).toFixed(0)}M`;
  return `${n}`;
};
const fmtPrice = (n) => {
  if (n === null || n === undefined) return '—';
  if (n >= 10000) return n.toLocaleString('en-US', { maximumFractionDigits: 0 });
  return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtPct = (n, d = 2) => (n === null || n === undefined ? '—' : `${n >= 0 ? '+' : ''}${n.toFixed(d)}%`);
const fmtMagnitude = (n, d = 1) => (n === null || n === undefined ? '—' : `${n.toFixed(d)}%`);
const fmtNum = (n, d = 2) => (n === null || n === undefined ? '—' : n.toFixed(d));
/* Raw scores are small daily quantities — a vol-adjusted residual runs about
   ±0.15, a bare mean log return about ±0.005 — so precision adapts to the
   magnitude instead of rounding everything to a wall of 0.00s. */
const fmtScore = (v) => {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a >= 100) return v.toFixed(0);
  if (a >= 1) return v.toFixed(2);
  if (a >= 0.01) return v.toFixed(3);
  if (a === 0) return '0.000';
  return v.toFixed(Math.min(6, 2 - Math.floor(Math.log10(a))));
};
const fmtRank = (n) => (n === null || n === undefined ? '—' : `#${n}`);
const toneClass = (v) => (v === null || v === undefined || v === 0 ? 'flat' : v > 0 ? 'up' : 'dn');
const missingReason = (key) => ({
  score: 'Needs more history than this formula uses',
  '2y': 'Needs 2 years', '1y': 'Needs 1 year',
  maxDrawdown: 'Needs 1 year', '6m': 'Needs 6 months', '90d': 'Needs 6 months',
  '3m': 'Needs 3 months', ytd: 'Listed this year',
}[key] || 'Not enough history');

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const formatMetric = (format, value) => {
  switch (format) {
    case 'cap': return fmtCap(value);
    case 'pct': return fmtPct(value);
    case 'pct0': return value === null || value === undefined ? '—' : `${value.toFixed(0)}%`;
    case 'score': return fmtScore(value);
    default: return fmtNum(value);
  }
};

/* ============================================================ persistence */
const store = {
  read(key, fallback) {
    try { const raw = localStorage.getItem(`top300/${key}`); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  },
  write(key, value) {
    try { localStorage.setItem(`top300/${key}`, JSON.stringify(value)); } catch (e) { /* private mode */ }
  },
};

/* ================================================================== state */
/* The app always opens on the same view — the Top 300, no sector filter, best
   momentum first — rather than resuming wherever it was last left. Only the
   watchlist is remembered, because that is the reader's data rather than a
   position in the app. */
const state = {
  tab: 'ranks',
  universeKey: 'all',
  sortKey: 'score',
  direction: 'desc',
  query: '', sector: 'All', industry: 'All',
  watchSort: 'score',
  watchlist: store.read('watchlist', []),
  /* The formula is the reader's data the way the watchlist is, so it survives
     a reload; everything positional resets. */
  formula: normalizeFormula(store.read('formula', null)),
  hasScrubbed: store.read('scrubbed', false),
  open: null,           // { symbol, tableKey, tab } or null
  range: '1Y',
  sheet: null,          // 'universe' | 'cut' | 'formula' | null
};
if (!DATA.tables[state.universeKey]) state.universeKey = DATA.index.universes[0].key;

/* The rows each tab currently has on screen, which is what every score and
   placing in the app is measured against. */
const views = { ranks: [], watchlist: [] };

const SPARK_SESSIONS = 90;
const SPARK_POINTS = 24;
const YEAR_SESSIONS = 252;

/* The last session the current formula sees — the deepest skip among its
   active windows, counted back from the last close. Everything after it is
   the stretch the score is blind to, and is what the charts draw in grey.
   With SKIP off there is no blind spot and no grey. */
function throughOf(table) {
  const back = maxSkipOf(state.formula);
  if (!back) return null;
  const dates = table.dates;
  return dates[Math.max(0, dates.length - 1 - back)];
}

/** Index of the last point the score covers, or -1 if it covers none. */
function cutIndex(points, through) {
  if (!through) return points.length - 1;
  let cut = -1;
  for (let i = 0; i < points.length; i += 1) {
    if (points[i].date <= through) cut = i;
  }
  return cut;
}

/**
 * Where the last close sits in its 52-week range, and how it got there.
 *
 * With SKIP on the score stops measuring up to a month back, so a name can be
 * near the top of the table and well off its high — the pullback happened
 * inside the blind spot. This is the number that shows it. High and low are
 * closing prices, since closes are all this app carries; a broker quoting
 * intraday extremes will show a slightly wider band.
 */
function range52(ticker, dates) {
  const points = seriesFor(ticker, dates, YEAR_SESSIONS);
  if (points.length < 2) return null;
  let low = points[0];
  let high = points[0];
  for (const p of points) {
    if (p.close < low.close) low = p;
    if (p.close > high.close) high = p;
  }
  const last = points[points.length - 1].close;
  const band = high.close - low.close;
  return {
    low, high, last,
    // 0 sits on the low, 1 on the high. A flat year has no position to report,
    // so it reads as sitting on its high rather than dividing by nothing.
    position: band > 0 ? (last - low.close) / band : 1,
    offHigh: high.close ? (last / high.close - 1) * 100 : 0,
    aboveLow: low.close ? (last / low.close - 1) * 100 : 0,
    sessions: points.length,
  };
}

/** The move the skip left out: from the last covered close to the latest one. */
function noseMove(ticker, dates, through) {
  const points = seriesFor(ticker, dates, Infinity);
  const cut = cutIndex(points, through);
  if (cut < 0 || cut >= points.length - 1) return null;
  const from = points[cut].close;
  const to = points[points.length - 1].close;
  return from ? (to / from - 1) * 100 : null;
}

/**
 * Sparkline geometry, in two strokes rather than one.
 *
 * The stretch the score measures is drawn in the direction colour and
 * everything after its cutoff in grey, so the nose reads as separate from the
 * window the score came from. Each half is sampled on its own account so the
 * join lands on the real cutoff, and every point carries its place in the
 * whole series rather than its index within its own half — otherwise the
 * short grey tail would be stretched to the same width as the long coloured
 * head.
 */
function sparkGeometry(points, through) {
  const n = points.length;
  if (n < 2) return null;
  const cut = Math.max(0, cutIndex(points, through));
  const sample = (from, to, count) => {
    const span = to - from;
    if (span < 1) return null;
    const k = Math.max(2, Math.min(count, span + 1));
    const out = [];
    for (let i = 0; i < k; i += 1) {
      const idx = from + Math.round((span * i) / (k - 1));
      out.push({ x: idx / (n - 1), close: points[idx].close });
    }
    return out;
  };
  return { head: sample(0, cut, 18), tail: sample(cut, n - 1, 7) };
}

/* Scores and sparkline geometry per universe, computed once per formula and
   kept. Both depend on the formula — the score entirely, the spark through
   its grey cutoff — so a formula change empties the cache and the next render
   recomputes whatever tables it actually touches. */
const decorated = {};
function tickersOf(key) {
  if (!decorated[key]) {
    const table = DATA.tables[key];
    const R = tableReturns(key);
    const n = table.dates.length;
    const through = throughOf(table);
    decorated[key] = table.tickers.map((t) => {
      const points = seriesFor(t, table.dates, SPARK_SESSIONS);
      const { score, parts } = scoreTicker(R.bySymbol.get(t.symbol), R, t.sector, n, state.formula);
      return {
        ...t, score, scoreParts: parts,
        spark: sparkGeometry(points, through), sparkChange: changeOver(points),
      };
    });
  }
  return decorated[key];
}

function applyFormula(mutate) {
  mutate(state.formula);
  state.formula = normalizeFormula(state.formula);
  store.write('formula', state.formula);
  for (const key of Object.keys(decorated)) delete decorated[key];
  renderRanks(); renderWatch();
  if (state.open) renderTicker();
  if (state.sheet === 'formula') renderFormulaSheet();
}

const $ = (id) => document.getElementById(id);

/* ============================================================== sparkline */
function sparkSvg(spark, change) {
  const segments = spark ? [spark.head, spark.tail].filter(Boolean) : [];
  if (!segments.length) return '<svg class="spark" aria-hidden="true"></svg>';

  let min = Infinity; let max = -Infinity;
  for (const seg of segments) {
    for (const p of seg) { if (p.close < min) min = p.close; if (p.close > max) max = p.close; }
  }
  const span = max - min || 1;
  const W = 54; const H = 22; const pad = 2;
  const usable = H - pad * 2;
  const trace = (seg) => seg.map((p) =>
    `${(p.x * W).toFixed(1)},${(pad + usable - ((p.close - min) / span) * usable).toFixed(1)}`).join(' ');
  const stroke = (seg, color) =>
    `<polyline points="${trace(seg)}" fill="none" stroke="${color}" stroke-width="1.4" ` +
    `stroke-linejoin="round" stroke-linecap="round"/>`;

  const color = (change ?? 0) >= 0 ? 'var(--acid)' : 'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">` +
    (spark.head ? stroke(spark.head, color) : '') +
    (spark.tail ? stroke(spark.tail, 'var(--faint)') : '') +
    `</svg>`;
}

/* ==================================================================== rows */
/** The 52-week track: low at the left, high at the right, today's close on it. */
function rangeHtml(band) {
  if (!band) return '';
  const at = Math.max(0, Math.min(100, band.position * 100));
  // A listing younger than a year has no 52 weeks to report, so it says so
  // rather than passing four months off as the year.
  return `<span class="range">` +
    `<span class="range-cap">${band.sessions >= YEAR_SESSIONS ? '52W' : 'MAX'}</span>` +
    `<span class="range-end">${fmtPrice(band.low.close)}</span>` +
    `<span class="range-track"><span class="range-dot" style="left:${at.toFixed(1)}%"></span></span>` +
    `<span class="range-end">${fmtPrice(band.high.close)}</span>` +
    `<span class="range-off">${band.offHigh <= -0.05 ? fmtPct(band.offHigh, 1) : 'AT HIGH'}</span>` +
    `</span>`;
}

function rowHtml(t, position, sort, starred, band) {
  // Sorting by market cap makes the row number the rank, so the metric column
  // would just repeat it; show the day's move there instead.
  const metricIsCap = sort.format === 'cap';
  const metricValue = metricIsCap ? t.changePct : sort.value(t);
  const shown = formatMetric(metricIsCap ? 'pct' : sort.format, metricValue);
  // Volatility is a magnitude and carries no sign worth colouring; the day's
  // move and both scores do.
  const colored = sort.tone ? toneClass(metricValue) : '';
  const label = `${esc(t.symbol)}, ${esc(t.name)}. ${sort.label} ${shown}.` +
    (band ? ` ${fmtPct(band.offHigh, 1)} from its 52 week high of ${fmtPrice(band.high.close)}.` : '');
  return `<button class="row${starred ? ' starred' : ''}${band ? ' row-tall' : ''}" ` +
    `data-sym="${esc(t.symbol)}" aria-label="${label}">` +
    (band ? '<span class="row-main">' : '') +
    `<span class="pos">${position === null || position === undefined ? '—' : position}</span>` +
    logoHtml(t.symbol, 'tile') +
    `<span class="identity"><span class="sym">${esc(t.symbol)}</span><span class="nm">${esc(t.name)}</span></span>` +
    sparkSvg(t.spark, t.sparkChange) +
    `<span class="nums"><span class="metric ${colored}">${shown}</span></span>` +
    `<span class="star${starred ? ' on' : ''}" data-star="${esc(t.symbol)}" role="button" tabindex="0" ` +
    `aria-label="${starred ? 'Remove from' : 'Add to'} watchlist">${starred ? '★' : '☆'}</span>` +
    (band ? `</span>${rangeHtml(band)}` : '') +
    `</button>`;
}

/* =============================================================== watch tab */
function watchTickers() {
  if (!state.watchlist.length) return [];
  const wanted = new Set(state.watchlist);
  const found = new Map();
  // The open universe wins when a name appears in more than one, so numbers
  // here match the ones on Ranks.
  const order = [
    ...DATA.index.universes.map((u) => u.key).filter((k) => k !== state.universeKey),
    state.universeKey,
  ];
  for (const key of order) {
    for (const t of tickersOf(key)) {
      if (wanted.has(t.symbol)) found.set(t.symbol, { key, t });
    }
  }
  return Array.from(found.values());
}

function renderWatch() {
  const entries = watchTickers();
  const list = entries.map((e) => e.t);
  const sort = sortByKey(state.watchSort);
  const rows = arrange(list, { sortKey: state.watchSort, direction: 'desc' });
  const tableKeyOf = new Map(entries.map((e) => [e.t.symbol, e.key]));

  $('watch-subtitle').textContent = `${list.length} ${list.length === 1 ? 'TICKER' : 'TICKERS'} TRACKED`;
  $('watch-tab-label').textContent = state.watchlist.length ? `WATCH ${state.watchlist.length}` : 'WATCH';

  const avgBox = $('watch-avg');
  if (list.length) {
    const avg = list.reduce((sum, t) => sum + (t.changePct || 0), 0) / list.length;
    avgBox.hidden = false;
    const v = $('watch-avg-value');
    v.textContent = fmtPct(avg);

  $('watch-chips').innerHTML = list.length ? SORTS.map((s) =>
    `<button class="chip${s.key === state.watchSort ? ' active' : ''}" data-wsort="${s.key}" ` +
    `aria-label="Sort by ${s.label}">${s.short}</button>`).join('') +
    `<button class="chip" data-formula-open aria-label="Edit the score formula">` +
    `ƒ ${esc(describeFormula(state.formula))}</button>` : '';
  $('watch-columns').hidden = !list.length;

  views.watchlist = rows;
  $('watch-list').innerHTML = rows.length
    ? rows.map((t, i) => {

        const key = tableKeyOf.get(t.symbol);
        const band = range52(t, DATA.tables[key].dates);
        const html = rowHtml(t, i + 1, sort, true, band);
        return html.replace('data-sym="', `data-table="${esc(key)}" data-sym="`);

    : '<div class="empty"><div class="empty-title">NOTHING TRACKED YET</div>' +
      '<div class="empty-hint">Tap the star beside any row on the Ranks screen, or open a ticker ' +
      'and tap WATCH. Stars from every universe land here together.</div></div>';
}

/* ------------------------------------------------------------- the chart */
function mountChart(points, through) {
  const box = $('chart-box');
  const readout = $('chart-readout');
  const axis = $('chart-axis');
  const H = 200; const PAD_TOP = 14; const PAD_BOTTOM = 18;

  if (!points || points.length < 2) {
    box.innerHTML = '<div class="empty" style="height:100%"><div class="empty-hint">NOT ENOUGH HISTORY</div></div>';
    readout.innerHTML = ''; axis.innerHTML = '';
    return;
  }

  let min = Infinity; let max = -Infinity;
  for (const p of points) { if (p.close < min) min = p.close; if (p.close > max) max = p.close; }
  const span = max - min || Math.abs(max) * 0.02 || 1;
  const W = box.clientWidth || 600;
  const usable = H - PAD_TOP - PAD_BOTTOM;
  const step = W / (points.length - 1);
  const xy = points.map((p, i) => ({
    x: i * step, y: PAD_TOP + usable - ((p.close - min) / span) * usable,
  }));
  const path = (arr) => arr.map((c, i) => `${i === 0 ? 'M' : 'L'}${c.x.toFixed(2)} ${c.y.toFixed(2)}`).join(' ');
  const line = path(xy);
  const area = `${line} L${W} ${H - PAD_BOTTOM} L0 ${H - PAD_BOTTOM} Z`;
  const rising = points[points.length - 1].close >= points[0].close;
  const stroke = rising ? 'var(--acid)' : 'var(--down)';

  // The tail the skip leaves out, greyed so it reads apart from the stretch
  // the score came from. A range that begins after the cutoff has no split to
  // draw — it is all blind spot, which the caption says instead.
  const mark = cutIndex(points, through);
  const showNose = mark >= 1 && mark < points.length - 1;
  const cut = showNose ? mark : points.length - 1;
  const head = path(xy.slice(0, cut + 1));
  const tail = showNose ? path(xy.slice(cut)) : null;
  const allAfter = mark < 1;

  const idle = () => {
    readout.innerHTML =
      `<span class="readout-main"><span class="k">LOW </span>${fmtPrice(min)}` +
      `<span class="k">&nbsp;&nbsp;&nbsp;HIGH </span>${fmtPrice(max)}</span>` +
      `<span class="readout-date">${points.length} sessions</span>`;
  };
  idle();
  axis.innerHTML = `<span>${esc(points[0].date)}</span><span>${esc(points[points.length - 1].date)}</span>`;
  const note = $('chart-note');
  if (note) {
    const back = maxSkipOf(state.formula);
    note.textContent = !through ? ''
      : showNose
        ? `Grey: after ${through}, the ${back} trading days the score skips.`
        : allAfter
          ? `The score's window ends ${through}, before this range begins — it sees none of this.`
          : '';
  }

  box.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" ` +
    `aria-label="Price chart, ${points.length} sessions, low ${fmtPrice(min)}, high ${fmtPrice(max)}">` +
    `<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">` +
    `<stop offset="0" stop-color="${stroke === 'var(--acid)' ? '#C8FF00' : '#FF6B4F'}" stop-opacity="0.22"/>` +
    `<stop offset="1" stop-color="${stroke === 'var(--acid)' ? '#C8FF00' : '#FF6B4F'}" stop-opacity="0"/>` +
    `</linearGradient></defs>` +
    `<line x1="0" y1="${H - PAD_BOTTOM}" x2="${W}" y2="${H - PAD_BOTTOM}" stroke="var(--line)"/>` +
    `<path d="${area}" fill="url(#fade)"/>` +
    (tail
      ? `<line x1="${xy[cut].x.toFixed(2)}" y1="${PAD_TOP - 8}" x2="${xy[cut].x.toFixed(2)}" ` +
        `y2="${H - PAD_BOTTOM}" stroke="var(--line)" stroke-dasharray="2 3"/>`
      : '') +
    `<path d="${head}" fill="none" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>` +
    (tail
      ? `<path d="${tail}" fill="none" stroke="var(--faint)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`
      : '') +
    `<g id="cursor" style="display:none">` +
    `<line id="cursor-line" x1="0" y1="${PAD_TOP - 8}" x2="0" y2="${H - PAD_BOTTOM}" stroke="var(--dim)"/>` +
    `<circle id="cursor-dot" r="4.5" fill="${stroke}"/></g></svg>` +
    (state.hasScrubbed ? '' : '<div class="chart-hint" id="chart-hint"><span>DRAG TO INSPECT</span></div>');

  const cursor = box.querySelector('#cursor');
  const cLine = box.querySelector('#cursor-line');
  const cDot = box.querySelector('#cursor-dot');

  const scrub = (clientX) => {
    const rect = box.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * W;
    const i = Math.max(0, Math.min(points.length - 1, Math.round(x / step)));
    cursor.style.display = '';
    cLine.setAttribute('x1', xy[i].x); cLine.setAttribute('x2', xy[i].x);
    cDot.setAttribute('cx', xy[i].x); cDot.setAttribute('cy', xy[i].y);
    readout.innerHTML =
      `<span class="readout-main">${fmtPrice(points[i].close)}</span>` +
      `<span class="readout-date">${esc(points[i].date)}</span>`;
    if (!state.hasScrubbed) {
      state.hasScrubbed = true; store.write('scrubbed', true);
      const hint = box.querySelector('#chart-hint');
      if (hint) hint.remove();
    }
  };
  let down = false;
  box.onpointerdown = (e) => { down = true; box.setPointerCapture(e.pointerId); scrub(e.clientX); };
  box.onpointermove = (e) => { if (down || e.pointerType === 'mouse') scrub(e.clientX); };
  const release = () => { down = false; cursor.style.display = 'none'; idle(); };
  box.onpointerup = release;
  box.onpointercancel = release;
  box.onpointerleave = (e) => { if (!down) release(); };
}

/* ================================================================= sheets */
/**
 * The formula sheet: the score's parts laid out as controls.
 *
 * Nothing here is applied on close — every tap lands immediately, the list
 * re-ranks behind the sheet, and the sheet itself re-renders to show the new
 * state. The default is the 50/50 blend of 12M and 6M, skipped, vol-adjusted,
 * market-residual.
 */
function renderFormulaSheet() {
  const f = state.formula;
  const winChips = (slot) => LOOKBACKS.map((w) => {
    const active = f.windows[slot] === w;
    return `<button class="chip${active ? ' active' : ''}" data-fwin="${slot}:${w}" ` +
      `aria-label="Set window ${slot ? 'B' : 'A'} to ${LOOKBACK_LABEL[w]}" aria-pressed="${active}">` +
      `${LOOKBACK_LABEL[w]} · ${w}D${f.skip ? ` −${SKIP[w]}` : ''}</button>`;
  }).join('');
  const toggle = (key, label, sub, on, disabled = '') =>
    `<button class="f-toggle${on ? ' on' : ''}" data-ftoggle="${key}" role="switch" ` +
    `aria-checked="${on}" aria-label="${label}" ${disabled}>` +
    `<span class="f-text"><span class="f-label">${label}</span>` +
    `<span class="f-sub">${sub}</span></span>` +
    `<span class="f-pill">${on ? 'ON' : 'OFF'}</span></button>`;

  const expr = f.blend
    ? `<span class="k">0.5</span>·score(${LOOKBACK_LABEL[f.windows[0]]}) + ` +
      `<span class="k">0.5</span>·score(${LOOKBACK_LABEL[f.windows[1]]})`
    : `score(${LOOKBACK_LABEL[f.windows[0]]})`;
  const inner = [
    f.skip ? 'skip recent' : null, f.sector ? 'mkt+sector residual' : f.market ? 'mkt residual' : null,
    f.vol ? 'mean ÷ vol' : 'mean return',
  ].filter(Boolean).join(', ');

  $('sheet-title').textContent = 'SCORE FORMULA';
  $('sheet-hint').hidden = false;
  $('sheet-hint').textContent =
    'Every change applies immediately — the table behind this sheet is already re-ranked.';
  $('sheet-list').innerHTML =
    `<div class="f-formula">score = ${expr}<br>where score(w) = ${esc(inner)}</div>` +
    `<div class="f-section">WINDOW${f.blend ? ' A' : ''}</div>` +
    `<div class="f-chiprow">${winChips(0)}</div>` +
    (f.blend ? `<div class="f-section">WINDOW B</div><div class="f-chiprow">${winChips(1)}</div>` : '') +
    toggle('blend', 'BLEND 50/50', 'Score two windows independently and average their raw scores.', f.blend) +
    toggle('skip', 'SKIP RECENT', 'Exclude the most recent round(window/12) sessions: 5, 10, 16 or 21 — the stretch that tends to reverse.', f.skip) +
    toggle('vol', 'VOLATILITY ADJUST', 'Divide the window’s mean daily log return by its own daily volatility.', f.vol) +
    toggle('market', 'MARKET RESIDUAL', `Regress on VTI over the ${EST_SESSIONS} sessions ending at the cutoff; score return − β·VTI.`, f.market, f.sector ? 'disabled' : '') +
    toggle('sector', 'SECTOR RESIDUAL', 'Regress on VTI and the sector’s SPDR fund together; score what neither explains. Includes the market leg.', f.sector) +
    `<button class="f-reset" data-freset>RESET TO DEFAULT — ƒ ${esc(describeFormula(normalizeFormula(null)))}</button>`;
  $('sheet-back').classList.add('open');
}

function openSheet(kind) {
  state.sheet = kind;
  if (kind === 'formula') { renderFormulaSheet(); return; }
  const table = DATA.tables[state.universeKey];
  const bySector = table.scope !== 'sector';
  let title = ''; let hint = ''; let options = []; let current = '';

  if (kind === 'universe') {
    title = 'UNIVERSE';
    hint = 'Each list ranks its own members, so a company places differently against the whole market than against its sector.';
    options = DATA.index.universes.map((u) => ({ value: u.key, label: u.title.toUpperCase(), count: u.size }));
    current = state.universeKey;
  } else {
    title = bySector ? 'FILTER BY SECTOR' : 'FILTER BY INDUSTRY';
    options = groupOptions(tickersOf(state.universeKey), bySector ? 'sector' : 'industry',
      bySector ? 'ALL SECTORS' : 'ALL INDUSTRIES');
    current = bySector ? state.sector : state.industry;
  }

  $('sheet-title').textContent = title;
  $('sheet-hint').hidden = !hint;
  $('sheet-hint').textContent = hint;
  $('sheet-list').innerHTML = options.map((o) =>
    `<button class="sheet-opt${o.value === current ? ' active' : ''}" data-value="${esc(o.value)}">` +
    `<span class="opt-label">${esc(o.label)}</span>` +
    `${o.count !== undefined ? `<span class="opt-count">${o.count}</span>` : ''}` +
    `<span class="opt-check">✓</span></button>`).join('');
  $('sheet-back').classList.add('open');
}

function closeSheet() { state.sheet = null; $('sheet-back').classList.remove('open'); }

function pickSheet(value) {
  const table = DATA.tables[state.universeKey];
  if (state.sheet === 'universe') {
    if (value !== state.universeKey) {
      state.universeKey = value;
      state.sector = 'All'; state.industry = 'All';
      renderRanks(); renderWatch();
      $('ranks-list').scrollTop = 0;
    }
  } else if (table.scope !== 'sector') { state.sector = value; renderRanks(); }
  else { state.industry = value; renderRanks(); }
  closeSheet();
}

/* ================================================================ actions */
function toggleStar(symbol) {
  const removing = state.watchlist.includes(symbol);
  state.watchlist = removing
    ? state.watchlist.filter((s) => s !== symbol)
    : [...state.watchlist, symbol];
  store.write('watchlist', state.watchlist);
  renderRanks(); renderWatch();
  if (state.open) renderTicker();
}

function openTicker(symbol, tableKey) {
  // A row on Ranks belongs to the open universe; a Watchlist row remembers
  // which table its numbers came from.
  const key = tableKey && DATA.tables[tableKey] ? tableKey
    : tickersOf(state.universeKey).some((t) => t.symbol === symbol) ? state.universeKey
    : DATA.index.universes.map((u) => u.key).find((k) => tickersOf(k).some((t) => t.symbol === symbol));
  if (!key) return;
  // Which tab it was opened from decides which rows its placings are measured
  // against — the filtered Ranks list, or the watchlist.
  state.open = { symbol, tableKey: key, tab: state.tab };
  state.range = '1Y';
  renderTicker();
  if (!location.hash.slice(1)) history.pushState({ ticker: symbol }, '', `#${symbol}`);
}

function closeTicker(fromPop) {
  state.open = null;
  $('ticker-overlay').classList.remove('open');
  if (!fromPop && location.hash) history.back();
}

/* ================================================================= wiring */
function setTab(key) {
  state.tab = key;
  document.querySelectorAll('.tab').forEach((el) => {
    const active = el.dataset.tab === key;
    el.classList.toggle('active', active);
    el.setAttribute('aria-selected', active);
  });
  $('pane-ranks').classList.toggle('active', key === 'ranks');
  $('pane-watchlist').classList.toggle('active', key === 'watchlist');
}

document.querySelectorAll('.tab').forEach((el) => {
  el.addEventListener('click', () => {
    if (el.dataset.tab === state.tab) {
      const list = state.tab === 'ranks' ? $('ranks-list') : $('watch-list');
      list.scrollTo({ top: 0, behavior: 'smooth' });
    } else setTab(el.dataset.tab);
  });
});

$('universe-btn').addEventListener('click', () => openSheet('universe'));
$('cut-btn').addEventListener('click', () => openSheet('cut'));
$('sheet-back').addEventListener('click', (e) => {
  const flip = e.target.closest('[data-ftoggle]');
  if (flip && !flip.disabled) {
    const key = flip.dataset.ftoggle;
    applyFormula((f) => { f[key] = !f[key]; });
    return;
  }
  const win = e.target.closest('[data-fwin]');
  if (win) {
    const [slot, sessions] = win.dataset.fwin.split(':').map(Number);
    applyFormula((f) => {
      const other = 1 - slot;
      // Picking the other slot's window swaps them, so the pair stays a pair.
      if (f.windows[other] === sessions) f.windows[other] = f.windows[slot];
      f.windows[slot] = sessions;
    });
    return;
  }
  if (e.target.closest('[data-freset]')) {
    applyFormula((f) => Object.assign(f, normalizeFormula(null)));
    return;
  }
  const opt = e.target.closest('.sheet-opt');
  if (opt) pickSheet(opt.dataset.value);
  else if (!e.target.closest('.sheet')) closeSheet();
});

$('search').addEventListener('input', (e) => {
  state.query = e.target.value;
  $('search-clear').classList.toggle('show', !!state.query);
  renderRanks();
});
$('search-clear').addEventListener('click', () => {
  state.query = ''; $('search').value = '';
  $('search-clear').classList.remove('show');
  renderRanks();
});
$('summary-clear').addEventListener('click', () => {
  state.query = ''; $('search').value = '';
  $('search-clear').classList.remove('show');
  state.sector = 'All'; state.industry = 'All';
  renderRanks();
});
$('dir-btn').addEventListener('click', () => {
  state.direction = state.direction === 'desc' ? 'asc' : 'desc';
  renderRanks();
});

/* One delegated handler per surface: rows, stars, chips. */
function listHandler(e) {
  const star = e.target.closest('[data-star]');
  if (star) { e.stopPropagation(); toggleStar(star.dataset.star); return; }
  if (e.target.closest('[data-formula-open]')) { openSheet('formula'); return; }
  const chip = e.target.closest('[data-sort]');
  if (chip) {
    const key = chip.dataset.sort;
    if (key === state.sortKey) state.direction = state.direction === 'desc' ? 'asc' : 'desc';
    else { state.sortKey = key; state.direction = 'desc'; }
    renderRanks(); return;
  }
  const wchip = e.target.closest('[data-wsort]');
  if (wchip) { state.watchSort = wchip.dataset.wsort; renderWatch(); return; }
  const row = e.target.closest('.row');
  if (row) openTicker(row.dataset.sym, row.dataset.table);
}
$('pane-ranks').addEventListener('click', listHandler);
$('pane-watchlist').addEventListener('click', listHandler);

$('ticker-overlay').addEventListener('click', (e) => {
  if (e.target.closest('#back-btn')) { closeTicker(); return; }
  if (e.target.closest('[data-formula-open]')) { openSheet('formula'); return; }
  const star = e.target.closest('[data-star]');
  if (star) { toggleStar(star.dataset.star); return; }
  const chip = e.target.closest('[data-range]');
  if (chip) { state.range = chip.dataset.range; renderTicker(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (state.sheet) closeSheet();
  else if (state.open) closeTicker();
});
window.addEventListener('popstate', () => { if (state.open) closeTicker(true); });

/* ==================================================================== go */
renderRanks();
renderWatch();
if (location.hash.length > 1) {
  const symbol = decodeURIComponent(location.hash.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  openTicker(symbol);
}
</script>
